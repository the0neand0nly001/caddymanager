services:
  manager:
    image: ${CADDY_MANAGER_IMAGE:-caddymanager:2.0.0}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      CADDY_MANAGER_DATA_DIR: /data
      CADDYFILE_PATH: /etc/caddy/Caddyfile
      CADDY_ADMIN_URL: http://caddy:2019
      CADDY_DOMAINS: ${CADDY_DOMAINS:-home.lab,testhome.lab}
      ADGUARD_IP: ${ADGUARD_IP:-192.168.1.100}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${MANAGER_PORT:-5000}:5000"
    volumes:
      - manager_data:/data
      - caddy_files:/etc/caddy
    networks:
      - caddy

  caddy:
    image: ${CADDY_IMAGE:-caddy:2.11.7}
    restart: unless-stopped
    depends_on:
      manager:
        condition: service_healthy
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${CADDY_HTTP_PORT:-80}:80"
      - "${BIND_ADDRESS:-0.0.0.0}:${CADDY_HTTPS_PORT:-443}:443"
      - "${BIND_ADDRESS:-0.0.0.0}:${CADDY_HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_files:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - caddy

volumes:
  manager_data:
  caddy_files:
  caddy_data:
  caddy_config:

networks:
  caddy:
