{% macro icon(name) -%}
    <svg class="icon"
         viewBox="0 0 24 24"
         fill="none"
         stroke="currentColor"
         stroke-width="1.7"
         stroke-linecap="round"
         stroke-linejoin="round"
         aria-hidden="true"
         focusable="false">
        {% if name == "dashboard" %}
            <rect x="3" y="3" width="7" height="7" rx="1.5" /><rect x="14" y="3" width="7" height="7" rx="1.5" /><rect x="3" y="14" width="7" height="7" rx="1.5" /><rect x="14" y="14" width="7" height="7" rx="1.5" />
        {% elif name == "routes" %}
            <circle cx="6" cy="5" r="2" /><circle cx="18" cy="12" r="2" /><circle cx="6" cy="19" r="2" />
            <path d="M6 7v10m0-5h10" />
        {% elif name == "activity" %}
            <path d="M8 5h13M8 12h13M8 19h13" />
            <circle cx="3" cy="5" r=".7" /><circle cx="3" cy="12" r=".7" /><circle cx="3" cy="19" r=".7" />
        {% elif name == "settings" %}
            <path d="m9 3-.7 2.2-2 .9-2.1-.5-2 3.4 1.5 1.7v2.6L2.2 15l2 3.4 2.1-.5 2 .9L9 21h4l.7-2.2 2-.9 2.1.5 2-3.4-1.5-1.7v-2.6L19.8 9l-2-3.4-2.1.5-2-.9L13 3Z" />
            <circle cx="11" cy="12" r="3" />
        {% elif name == "collapse" %}
            <rect x="3" y="4" width="18" height="16" rx="2" />
            <path d="M9 4v16m7-11-3 3 3 3" />
        {% elif name == "menu" %}
            <path d="M4 6h16M4 12h16M4 18h16" />
        {% elif name == "close" %}
            <path d="m6 6 12 12M6 18 18 6" />
        {% elif name == "logout" %}
            <path d="M9 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4m6-12 4 4-4 4m-6-4h10" />
        {% elif name == "download" %}
            <path d="M12 3v12m-4-4 4 4 4-4M4 16v4h16v-4" />
        {% elif name == "book" %}
            <path d="M12 5v15m0-15C9 3 5 3 3 4v15c3-1 6-1 9 1 3-2 6-2 9-1V4c-2-1-6-1-9 1Z" />
        {% endif %}
    </svg>
{%- endmacro %}
